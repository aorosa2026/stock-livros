<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f5c">
<title>Stock de Manuais</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* ======================================================================
     ÚNICA LINHA A ALTERAR: o link da Aplicação Web do Apps Script
     (Implementar → Gerir implementações → copiar o URL que termina em /exec)
     ====================================================================== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbx5mTZ4Yoy8IA2NxZZk4T3MJUuzuoyn_wpjgnlNjYdoRDEf-WWiuvj3PuuTJ81_LHV4/exec';
</script>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1f2a2e; --muted:#6b7578; --acc:#1f6f5c; --ok:#e3f2ec; --no:#fbe9e7; --line:#e2ded6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:1.25rem; margin:4px 0 14px; }
  .sair { background:none; border:0; color:var(--muted); font-size:.85rem; text-decoration:underline; cursor:pointer; }
  .btn { border:0; border-radius:12px; padding:14px 16px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-acc { background:var(--acc); color:#fff; width:100%; }
  .btn:disabled { opacity:.6; }
  .link { background:none; border:0; color:var(--acc); text-decoration:underline; font-size:.9rem; padding:8px 0; cursor:pointer; }
  #leitor { width:100%; margin-top:10px; border-radius:12px; overflow:hidden; }
  input[type=search], input[type=text], input[type=password] { width:100%; padding:14px; font-size:1rem; border:1px solid var(--line); border-radius:12px; margin-top:12px; background:#fff; color:var(--ink); }
  #sugestoes { list-style:none; padding:0; margin:8px 0 0; }
  #sugestoes li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; cursor:pointer; }
  #sugestoes li small { color:var(--muted); display:block; margin-top:2px; }
  #sugestoes li.mais { background:none; border:0; color:var(--muted); font-size:.85rem; cursor:default; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-top:14px; border:1px solid var(--line); }
  .estado { border-radius:10px; padding:10px 12px; font-weight:600; margin-bottom:10px; }
  .ok { background:var(--ok); color:#155443; } .no { background:var(--no); color:#8a2c1f; }
  .meta { color:var(--muted); font-size:.9rem; margin:4px 0 12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 14px; font-size:.95rem; cursor:pointer; color:var(--ink); }
  .chip.sel { background:var(--acc); color:#fff; border-color:var(--acc); }
  .qtd { display:flex; align-items:center; gap:10px; margin:12px 0; }
  .qtd button { width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:1.3rem; color:var(--ink); }
  .qtd span { min-width:30px; text-align:center; font-size:1.2rem; font-weight:600; }
  .stock { font-size:.9rem; color:var(--muted); }
  #msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; display:none; max-width:90%; text-align:center; }
  .fila { background:#fff6db; color:#7a5a00; border-radius:10px; padding:10px 12px; font-size:.9rem; margin:12px 0 0; }
  .tabs { display:flex; gap:6px; background:#ebe7df; border-radius:12px; padding:4px; margin-bottom:14px; }
  .tab { flex:1; border:0; background:none; padding:10px; border-radius:9px; font-size:.95rem; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab.sel { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .mov { display:flex; gap:6px; margin:4px 0 12px; }
  .mov button { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px; font-size:.95rem; font-weight:600; color:var(--ink); cursor:pointer; }
  .mov button.sel.entrada { background:var(--ok); border-color:#9fd2bf; color:#155443; }
  .mov button.sel.saida { background:var(--no); border-color:#e6b3aa; color:#8a2c1f; }
  .btn-saida { background:#b4432f; }
  .lista { list-style:none; padding:0; margin:0; }
  .lista li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .lista li small { color:var(--muted); display:block; margin-top:2px; }
  .lista .n { font-weight:700; white-space:nowrap; text-align:right; font-size:.9rem; }
  .lista .n.zero { color:#b4432f; }
  .lista .grupo { background:none; border:0; padding:12px 2px 4px; cursor:default; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <!-- ===== Entrada ===== -->
  <section id="ecraEntrada">
    <h1>📚 Stock de Manuais</h1>
    <div class="card">
      <label>O teu nome<input id="nome" type="text" autocomplete="name" placeholder="ex.: Alexandra"></label>
      <label>Palavra-passe<input id="pw" type="password" autocomplete="current-password"></label>
      <button id="btnEntrar" class="btn btn-acc" style="margin-top:14px">Entrar</button>
    </div>
  </section>

  <!-- ===== App ===== -->
  <section id="ecraApp" class="hidden">
    <header><h1>📚 Stock de Manuais</h1><button class="sair" id="btnSair">sair</button></header>
    <nav class="tabs">
      <button id="tabLeitura" class="tab sel">📷 Leitura</button>
      <button id="tabLista" class="tab">📋 Lista por ano</button>
    </nav>
    <p id="fila" class="fila hidden"></p>

    <!-- Vista: leitura -->
    <div id="vistaLeitura">
      <button id="btnLer" class="btn btn-acc">📷 Ler código de barras</button>
      <div id="leitor"></div>
      <button id="btnFoto" class="link">Não lê? Tirar uma foto ao código</button>
      <input id="foto" type="file" accept="image/*" capture="environment" hidden>

      <input id="pesquisa" type="search" placeholder="ISBN, título, disciplina ou ano — ex.: mat 5 ano" autocomplete="off">
      <ul id="sugestoes"></ul>

      <div id="ficha" class="card hidden"></div>
    </div>

    <!-- Vista: lista por ano -->
    <div id="vistaLista" class="hidden">
      <div class="chips" id="anos"></div>
      <p class="meta" id="resumoAno"></p>
      <ul id="listaAno" class="lista"></ul>
    </div>

    <p id="carregar" class="meta">A carregar lista…</p>
  </section>
</main>
<div id="msg"></div>

<script>
let LIVROS = [], STOCK = {}, scanner = null, atual = null, sel = new Set(), qtd = 1;
let SESSAO = { nome: '', pw: '' };

/* ---------- Ligação ao Apps Script ---------- */
/** Erro de rede (sem ligação ou demasiado lento) — distinto de um erro devolvido pelo servidor. */
class SemRede extends Error {}

async function api(acao, dados) {
  const ctrl = new AbortController();
  const limite = setTimeout(() => ctrl.abort(), 20000);
  let resp, texto;
  try {
    if (dados) {
      // text/plain evita o pedido prévio (CORS) que o Apps Script não aceita
      resp = await fetch(API_URL, { method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ acao, pw: SESSAO.pw, quem: SESSAO.nome }, dados)) });
    } else {
      resp = await fetch(API_URL + '?acao=' + acao + '&pw=' + encodeURIComponent(SESSAO.pw), { signal: ctrl.signal });
    }
    texto = await resp.text();
  } catch (e) {
    throw new SemRede('Sem ligação à internet');
  } finally {
    clearTimeout(limite);
  }
  let j;
  try { j = JSON.parse(texto); }
  catch (e) {
    throw new Error('O Apps Script não respondeu como esperado. Confirma em "Gerir implementações" ' +
      'que o acesso é "Qualquer pessoa" e que está na versão mais recente.');
  }
  if (!j.ok) throw new Error(j.erro || 'Erro desconhecido');
  return j;
}

/* ---------- Entrada ---------- */
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lerGuardado(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

document.getElementById('nome').value = lerGuardado('stock_nome');
document.getElementById('btnEntrar').onclick = entrar;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
document.getElementById('btnSair').onclick = () => { guardar('stock_pw', ''); guardar('stock_dados', ''); location.reload(); };

function mostrarApp(d, nome, atualizado) {
  LIVROS = d.livros; STOCK = Object.assign({}, d.stock);
  // O stock do servidor ainda não inclui os registos à espera de rede: soma-os
  if (atualizado) lerFila().forEach(m => m.partes.forEach(p => {
    const k = m.isbn + '|' + p; STOCK[k] = (STOCK[k] || 0) + m.qtd; }));
  mostrarFila();
  document.getElementById('carregar').textContent = LIVROS.length + ' livros na lista · ' + nome +
    (atualizado ? '' : ' · a atualizar…');
  document.getElementById('ecraEntrada').classList.add('hidden');
  document.getElementById('ecraApp').classList.remove('hidden');
  escreverStock();
}

async function entrar(automatico) {
  const nome = document.getElementById('nome').value.trim() || lerGuardado('stock_nome');
  const pw = automatico === true ? lerGuardado('stock_pw') : document.getElementById('pw').value;
  if (!nome) { toast('Escreve o teu nome.'); return; }
  if (!pw) return;
  SESSAO = { nome, pw };

  // Entrada rápida: se já houver uma lista guardada neste telemóvel, mostra-a já
  // e vai buscar a versão atual por trás.
  let rapido = false;
  if (automatico === true) {
    try {
      const g = JSON.parse(lerGuardado('stock_dados') || 'null');
      if (g && g.livros && g.livros.length) { mostrarApp(g, nome, false); rapido = true; }
    } catch (e) {}
  }

  const b = document.getElementById('btnEntrar');
  b.disabled = true; b.textContent = 'A entrar…';
  try {
    const d = await api('dados');
    guardar('stock_nome', nome); guardar('stock_pw', pw);
    guardar('stock_dados', JSON.stringify({ livros: d.livros, stock: d.stock }));
    mostrarApp(d, nome, true);
    enviarFila();
  } catch (e) {
    if (/palavra-passe/i.test(e.message)) {
      // A palavra-passe mudou: volta ao ecrã de entrada
      guardar('stock_pw', ''); guardar('stock_dados', '');
      document.getElementById('ecraApp').classList.add('hidden');
      document.getElementById('ecraEntrada').classList.remove('hidden');
      if (automatico === true) toast('A palavra-passe mudou. Escreve a nova.');
    }
    if (rapido) document.getElementById('carregar').textContent =
      LIVROS.length + ' livros (lista guardada; sem ligação) · ' + nome;
    else if (e instanceof SemRede && automatico !== true) toast('Sem ligação à internet. Tenta quando houver rede.');
    else if (automatico !== true || !/palavra-passe/i.test(e.message))
      toast(API_URL.indexOf('/exec') < 0 ? 'Falta colar o link do Apps Script no index.html.' : e.message);
  } finally {
    b.disabled = false; b.textContent = 'Entrar';
  }
}
if (lerGuardado('stock_pw')) entrar(true);

/* ---------- Leitura em direto ---------- */
document.getElementById('btnLer').onclick = async () => {
  if (scanner) { await pararLeitor(); return; }
  scanner = new Html5Qrcode('leitor', { verbose: false,
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  document.getElementById('btnLer').textContent = '✖ Parar leitura';
  try {
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.min(w * 0.9, 340), height: Math.min(h * 0.4, 150) }) },
      async txt => {
        if (navigator.vibrate) navigator.vibrate(80);
        await pararLeitor();
        procurar(txt.replace(/\D/g, ''));
      });
  } catch (e) {
    await pararLeitor();
    toast('Não foi possível abrir a câmara. Verifica a autorização da câmara para este site, ou tira uma foto.');
  }
};
async function pararLeitor() {
  if (scanner) { try { await scanner.stop(); } catch (e) {} try { scanner.clear(); } catch (e) {} scanner = null; }
  document.getElementById('btnLer').textContent = '📷 Ler código de barras';
}

/* ---------- Leitura por foto (reserva) ---------- */
const foto = document.getElementById('foto');
document.getElementById('btnFoto').onclick = async () => { await pararLeitor(); foto.value = ''; foto.click(); };
foto.addEventListener('change', async () => {
  const f = foto.files && foto.files[0];
  if (!f) return;
  toast('A ler o código…');
  let isbn = '';
  if ('BarcodeDetector' in window) {
    try {
      const r = await new BarcodeDetector({ formats: ['ean_13', 'ean_8'] }).detect(await createImageBitmap(f));
      isbn = (r[0] && r[0].rawValue || '').replace(/\D/g, '');
    } catch (e) {}
  }
  if (!isbn) {
    try {
      const l = new Html5Qrcode('leitor', { verbose: false, formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8] });
      isbn = String(await l.scanFile(f, false)).replace(/\D/g, '');
      l.clear();
    } catch (e) {}
  }
  if (isbn) procurar(isbn); else toast('Não consegui ler o código. Tenta outra foto, ou pesquisa por números.');
});

/* ---------- Pesquisa ---------- */
const campo = document.getElementById('pesquisa');
/** Texto para comparar: sem acentos, sem maiúsculas, e qualquer forma de escrever o ano
 *  ("1.º ano", "1º ano", "1o ano", "1 ano", "1ano") fica igual: "1ano". */
function normal(t) {
  return String(t).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[-–—_/]/g, ' ')
    .replace(/(\d+)\s*\.?\s*[o°]?\s*ano\b/g, '$1ano')
    .replace(/\s+/g, ' ').trim();
}
const textoPesquisa = l => l._p || (l._p = normal([l.titulo, l.disciplina, l.tipo, l.anos.join(' ')].join(' ')));

campo.addEventListener('input', () => {
  const bruto = campo.value.trim(), ul = document.getElementById('sugestoes');
  ul.innerHTML = '';
  if (bruto.length < 2) return;
  const soNum = /^[\d\s-]+$/.test(bruto) && bruto.replace(/\D/g, '').length >= 2;
  const q = soNum ? bruto.replace(/\D/g, '') : normal(bruto);
  const palavras = q.split(' ');
  const encontrados = LIVROS.filter(l => soNum ? l.isbn.includes(q)
      : palavras.every(p => textoPesquisa(l).includes(p)));
  encontrados.slice(0, 25).forEach(l => {
      const li = document.createElement('li');
      li.innerHTML = esc(l.titulo) + '<small>' + realce(l.isbn, soNum ? q : '') + ' · ' +
        esc([l.disciplina, l.anos.join(', ')].filter(Boolean).join(' · ')) + '</small>';
      li.onclick = () => { ul.innerHTML = ''; campo.value = ''; mostrar(l, l.isbn); };
      ul.appendChild(li);
    });
  if (encontrados.length > 25) {
    const li = document.createElement('li');
    li.className = 'mais';
    li.textContent = '+ ' + (encontrados.length - 25) + ' livros — escreve mais palavras, ou usa a Lista por ano';
    ul.appendChild(li);
  }
  if (!encontrados.length) {
    const li = document.createElement('li');
    li.className = 'mais';
    li.textContent = 'Nenhum livro encontrado';
    ul.appendChild(li);
  }
  if (soNum && q.length === 13 && !LIVROS.some(l => l.isbn === q)) procurar(q);
});

function procurar(isbn) { mostrar(LIVROS.find(l => l.isbn === isbn) || null, isbn); }

/* ---------- Ficha do livro ---------- */
let modo = 'entrada';   // 'entrada' ou 'saida'

function mostrar(livro, isbn) {
  mudarVista('leitura');
  atual = livro ? livro : { isbn, titulo: '(fora da lista)', disciplina: '', tipo: '', anos: [], partes: 1, fora: true };
  sel = new Set(); qtd = 1; modo = 'entrada';
  const f = document.getElementById('ficha');
  const partes = nomesPartes(atual.partes);
  if (partes.length === 1) sel.add(partes[0]);

  f.innerHTML =
    (livro ? '<div class="estado ok">✔ Está na lista</div>' : '<div class="estado no">✖ Não está na lista</div>') +
    '<strong>' + esc(atual.titulo) + '</strong>' +
    '<div class="meta">ISBN ' + esc(isbn) +
      esc([atual.disciplina, atual.tipo, atual.anos.join(', ')].filter(Boolean).map(s => ' · ' + s).join('')) + '</div>' +
    '<div class="mov"><button id="mEntrada" class="entrada sel">＋ Entrada</button><button id="mSaida" class="saida">－ Saída</button></div>' +
    (partes.length > 1 ? '<div>Que parte?</div><div class="chips" id="chips"></div>' : '') +
    '<div class="qtd"><button id="menos">−</button><span id="nq">1</span><button id="mais">+</button><span class="stock">unidade(s)</span></div>' +
    '<button id="btnAdd" class="btn btn-acc"></button>' +
    '<p class="stock" id="stockAtual"></p>';
  f.classList.remove('hidden');
  document.getElementById('mEntrada').onclick = () => mudarModo('entrada');
  document.getElementById('mSaida').onclick = () => mudarModo('saida');
  mudarModo('entrada');

  if (partes.length > 1) {
    const c = document.getElementById('chips');
    partes.concat(['Todas']).forEach(p => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = p;
      b.onclick = () => {
        if (p === 'Todas') { sel = sel.size === partes.length ? new Set() : new Set(partes); }
        else sel.has(p) ? sel.delete(p) : sel.add(p);
        [...c.children].forEach(ch => ch.classList.toggle('sel',
          ch.textContent === 'Todas' ? sel.size === partes.length : sel.has(ch.textContent)));
      };
      c.appendChild(b);
    });
  }
  document.getElementById('menos').onclick = () => { qtd = Math.max(1, qtd - 1); document.getElementById('nq').textContent = qtd; };
  document.getElementById('mais').onclick = () => { qtd++; document.getElementById('nq').textContent = qtd; };
  document.getElementById('btnAdd').onclick = adicionar;
  escreverStock();
  f.scrollIntoView({ behavior: 'smooth' });
}

/* ---------- Adicionar (com fila para quando não há rede) ----------
   Cada registo leva um id único: se um envio for repetido (ex.: a rede caiu depois de o
   servidor gravar), o Apps Script reconhece o id e não duplica a linha. */
function lerFila() { try { return JSON.parse(lerGuardado('stock_fila') || '[]'); } catch (e) { return []; } }
function gravarFila(f) { guardar('stock_fila', JSON.stringify(f)); mostrarFila(); }
function novoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function mostrarFila() {
  const n = lerFila().length, el = document.getElementById('fila');
  el.textContent = n ? '⏳ ' + n + ' registo(s) por enviar — são enviados quando houver rede' : '';
  el.classList.toggle('hidden', !n);
}

/** Soma ao stock mostrado no telemóvel (antes de o servidor confirmar). */
function somarLocal(m) {
  m.partes.forEach(p => { const k = m.isbn + '|' + p; STOCK[k] = (STOCK[k] || 0) + m.qtd; });
  guardar('stock_dados', JSON.stringify({ livros: LIVROS, stock: STOCK }));
}

let aEnviar = false, repetir = false;
async function enviarFila() {
  if (!SESSAO.pw) return;
  if (aEnviar) { repetir = true; return; }       // já há um envio a decorrer: repete quando acabar
  let fila = lerFila();
  if (!fila.length) return;
  aEnviar = true; repetir = false;
  let enviados = 0;
  try {
    while (fila.length) {
      try {
        await api('adicionar', fila[0]);
      } catch (e) {
        if (e instanceof SemRede || /palavra-passe/i.test(e.message)) break;   // tenta mais tarde
        toast('Registo de ' + fila[0].isbn + ' recusado: ' + e.message);       // erro do servidor: descarta
      }
      fila.shift(); gravarFila(fila); enviados++;
    }
  } finally {
    aEnviar = false;
    if (repetir) { repetir = false; setTimeout(enviarFila, 0); }
  }
  if (enviados && !fila.length) {
    toast('✔ ' + enviados + ' registo(s) guardado(s) na folha');
    try { const d = await api('dados'); STOCK = d.stock; guardar('stock_dados', JSON.stringify({ livros: LIVROS, stock: STOCK })); escreverStock(); } catch (e) {}
  }
}
window.addEventListener('online', enviarFila);
setInterval(enviarFila, 60000);

function mudarModo(m) {
  modo = m;
  document.getElementById('mEntrada').classList.toggle('sel', m === 'entrada');
  document.getElementById('mSaida').classList.toggle('sel', m === 'saida');
  textoBotao();
}
function textoBotao() {
  const b = document.getElementById('btnAdd');
  b.textContent = modo === 'saida' ? 'Retirar do stock'
    : (atual && atual.fora ? 'Adicionar mesmo assim' : 'Adicionar ao stock');
  b.classList.toggle('btn-saida', modo === 'saida');
}

/** Regista uma entrada (qtd positiva) ou saída (qtd negativa). */
async function adicionar() {
  if (!sel.size) { toast('Escolhe pelo menos uma parte.'); return; }
  const partes = [...sel];
  const sinal = modo === 'saida' ? -1 : 1;

  if (sinal < 0) {
    const faltam = partes.filter(p => (STOCK[atual.isbn + '|' + p] || 0) < qtd);
    if (faltam.length && !confirm('O stock ' + (partes.length > 1 ? 'de ' + faltam.join(' e ') + ' ' : '') +
        'é inferior a ' + qtd + '. Retirar mesmo assim? (o stock fica negativo)')) return;
  }

  const b = document.getElementById('btnAdd');
  b.disabled = true; b.textContent = 'A guardar…';
  const m = { id: novoId(), isbn: atual.isbn, titulo: atual.titulo, anos: atual.anos.join(', '), partes, qtd: sinal * qtd };
  const resumo = qtd + ' × ' + partes.join(' + ');
  const feito = sinal < 0 ? 'retirado' : 'adicionado';

  try {
    // Se já há registos à espera, este vai para o fim da fila (mantém a ordem)
    if (lerFila().length) {
      gravarFila(lerFila().concat([m])); somarLocal(m);
      toast('⏳ ' + resumo + ' ' + feito + ' (guardado no telemóvel)');
      enviarFila();
      return;
    }
    try {
      const r = await api('adicionar', m);
      STOCK = r.stock;
      guardar('stock_dados', JSON.stringify({ livros: LIVROS, stock: STOCK }));
      toast((sinal < 0 ? '－ ' : '✔ ') + resumo + ' ' + feito);
    } catch (e) {
      if (e instanceof SemRede) {
        gravarFila(lerFila().concat([m])); somarLocal(m);
        toast('📵 Sem rede: ' + resumo + ' ' + feito + ' no telemóvel. Envia sozinho quando houver rede.');
      } else {
        toast('Erro: ' + e.message);
      }
    }
  } finally {
    escreverStock();
    b.disabled = false; textoBotao();
  }
}

/* ---------- Separadores e lista por ano ---------- */
document.getElementById('tabLeitura').onclick = () => mudarVista('leitura');
document.getElementById('tabLista').onclick = () => mudarVista('lista');
let anoSel = '';

function mudarVista(v) {
  document.getElementById('tabLeitura').classList.toggle('sel', v === 'leitura');
  document.getElementById('tabLista').classList.toggle('sel', v === 'lista');
  document.getElementById('vistaLeitura').classList.toggle('hidden', v !== 'leitura');
  document.getElementById('vistaLista').classList.toggle('hidden', v !== 'lista');
  if (v === 'lista') { pararLeitor(); desenharLista(); window.scrollTo(0, 0); }
}

function ordemAno(a) {
  if (/pr[ée]/i.test(a)) return 0;
  const n = parseInt(String(a).replace(/\D/g, ''), 10);
  return isNaN(n) ? 99 : n;
}

function desenharLista() {
  const anos = [...new Set(LIVROS.flatMap(l => l.anos))].sort((a, b) => ordemAno(a) - ordemAno(b));
  if (!anoSel || anos.indexOf(anoSel) < 0) anoSel = anos[0] || '';

  const c = document.getElementById('anos');
  c.innerHTML = '';
  anos.forEach(a => {
    const b = document.createElement('button');
    b.className = 'chip' + (a === anoSel ? ' sel' : '');
    b.textContent = a.replace(' ano', '');
    b.onclick = () => { anoSel = a; desenharLista(); };
    c.appendChild(b);
  });

  const livros = LIVROS.filter(l => l.anos.indexOf(anoSel) >= 0)
    .sort((a, b) => (a.tipo === 'Leitura extensiva') - (b.tipo === 'Leitura extensiva') ||
      a.disciplina.localeCompare(b.disciplina) || a.titulo.localeCompare(b.titulo));
  const ul = document.getElementById('listaAno');
  ul.innerHTML = '';
  let semStock = 0, grupoAtual = null;
  livros.forEach(l => {
    const grupo = l.tipo === 'Leitura extensiva' ? 'Leitura extensiva' : 'Manuais e cadernos';
    if (grupo !== grupoAtual) {
      grupoAtual = grupo;
      const g = document.createElement('li'); g.className = 'grupo'; g.textContent = grupo; ul.appendChild(g);
    }
    const partes = nomesPartes(l.partes);
    const valores = partes.map(p => STOCK[l.isbn + '|' + p] || 0);
    const zero = valores.some(v => v <= 0);
    if (zero) semStock++;
    const li = document.createElement('li');
    li.innerHTML = '<div>' + esc(l.titulo) + '<small>' + esc([l.disciplina, l.isbn].filter(Boolean).join(' · ')) + '</small></div>' +
      '<div class="n' + (zero ? ' zero' : '') + '">' +
      (partes.length > 1 ? partes.map((p, i) => 'P' + (i + 1) + ': ' + valores[i]).join('<br>') : valores[0]) + '</div>';
    li.onclick = () => mostrar(l, l.isbn);
    ul.appendChild(li);
  });
  document.getElementById('resumoAno').textContent = livros.length + ' livros' +
    (semStock ? ' · ' + semStock + ' sem stock (a vermelho)' : '') + ' · toca num livro para dar entrada ou saída';
}

function escreverStock() {
  if (!document.getElementById('vistaLista').classList.contains('hidden')) desenharLista();
  if (!atual || !document.getElementById('stockAtual')) return;
  const partes = nomesPartes(atual.partes);
  document.getElementById('stockAtual').textContent = 'Em stock: ' +
    partes.map(p => (partes.length > 1 ? p + ': ' : '') + (STOCK[atual.isbn + '|' + p] || 0)).join(' · ');
}

function nomesPartes(n) { return n > 1 ? Array.from({ length: n }, (_, i) => 'Parte ' + (i + 1)) : ['Único']; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function realce(isbn, q) { if (!q) return esc(isbn); const i = isbn.indexOf(q); return esc(isbn.slice(0, i)) + '<b>' + q + '</b>' + esc(isbn.slice(i + q.length)); }
/* Cópia da página no telemóvel para abrir sem rede (ver sw.js) */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

function toast(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 3200); }
</script>
